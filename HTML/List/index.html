<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>List</title>
  </head>
  <body>
    <h1>Lists Example</h1>
    <h3>Ordered List</h3>
    <ol>
      <li>A</li>
      <li>B</li>
    </ol>
    <hr />
    <h3>Unorded List</h3>
    <ul>
      <li>1</li>
      <li>2</li>
    </ul>
  </body>
</html>
