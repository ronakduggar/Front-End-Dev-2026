<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Css Display Property</title>
    <style>
      .red {
        height: 200px;
        width: 200px;
        background-color: red;
        display: inline-block;
        border: 2px solid black;
        color: white;
      }
      .green {
        height: 200px;
        width: 200px;
        background-color: green;
        display: inline-block;
        border: 2px solid black;
        color: white;
      }
      .blue {
        height: 200px;
        width: 200px;
        background-color: blue;
        display: inline-block;
        border: 2px solid black;
        color: white;
      }
    </style>
  </head>
  <body>
    <h1>Css Display Property</h1>
    <p class="red">CSS Inline Property</p>
    <p class="green">CSS Block Property</p>
    <p class="blue">CSS Inline-Block Property</p>
  </body>
</html>
